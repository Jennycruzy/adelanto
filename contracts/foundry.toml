[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 10000
depth = 40
fail_on_revert = false

[profile.quick.invariant]
runs = 200
depth = 30

[rpc_endpoints]
celo = "${CELO_RPC_URL}"
ethereum = "${ETH_RPC_URL}"
